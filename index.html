<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dominic Klukas</title>
  <style>
    :root {
      --bg: #f7f7f4;
      --card: #ffffff;
      --text: #1f2933;
      --muted: #5f6b76;
      --line: #d8ddd7;
      --accent: #6e8a74;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: linear-gradient(to bottom, #f8f8f5 0%, #f4f5f1 100%);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 18px;
    }

    .page {
      width: 100%;
      max-width: 760px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 28px;
      padding: 48px 36px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(30, 40, 50, 0.05);
    }

    .photo {
      width: 176px;
      height: 176px;
      margin: 0 auto 26px;
      border-radius: 50%;
      overflow: hidden;
      border: 3px solid #edf0ea;
      box-shadow: 0 8px 24px rgba(31, 41, 51, 0.10);
      background: #eef1ec;
    }

    .photo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 35%;
      display: block;
    }

    h1 {
      margin: 0;
      font-size: clamp(2.1rem, 4vw, 2.9rem);
      font-weight: 600;
      letter-spacing: -0.03em;
    }

    .subtitle {
      margin-top: 12px;
      font-size: 1.08rem;
      color: var(--muted);
      line-height: 1.7;
    }

    .section {
      margin-top: 34px;
      padding-top: 28px;
      border-top: 1px solid var(--line);
    }

    .section h2 {
      margin: 0 0 10px;
      font-size: 0.92rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--accent);
    }

    .section p {
      margin: 0;
      font-size: 1.05rem;
      line-height: 1.8;
      color: var(--text);
    }

    a {
      color: inherit;
      text-decoration: none;
      border-bottom: 1px solid rgba(110, 138, 116, 0.45);
      transition: border-color 0.15s ease;
    }

    a:hover {
      border-color: rgba(110, 138, 116, 0.95);
    }

    .footer {
      margin-top: 22px;
      font-size: 0.94rem;
      color: var(--muted);
    }

    @media (max-width: 640px) {
      .card {
        padding: 36px 22px;
        border-radius: 22px;
      }

      .photo {
        width: 148px;
        height: 148px;
      }

      .subtitle, .section p {
        font-size: 1rem;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <section class="card">
      <div class="photo">
        <img src="profile-photo.png" alt="Portrait of Dominic Klukas" />
      </div>

      <h1>Dominic Klukas</h1>
      <p class="subtitle">
        Master's Student under Cyrus Neary<br />
        Department of Electrical and Computer Engineering<br />
        University of British Columbia
      </p>

      <div class="section">
        <h2>Contact</h2>
        <p><a href="mailto:klukasdh@student.ubc.ca">klukasdh@student.ubc.ca</a></p>
      </div>

      <div class="section">
        <h2>Interests</h2>
        <p>Interested in multi-agent reinforcement learning and geometric control.</p>
      </div>
    </section>
  </main>
</body>
</html>
